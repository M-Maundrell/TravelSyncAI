<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Planificador de Vuelos - Mario & Yesica</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    /* Estilos de transición suave */
    .ticket-card {
      transition: all 0.2s ease-in-out;
    }
  </style>
</head>
<body class="bg-[#f8fafc] text-slate-800 antialiased p-6">

  <!-- ENCABEZADO Y TABS -->
  <div class="max-w-6xl mx-auto bg-white border border-slate-200 rounded-2xl p-6 shadow-sm mb-6">
    <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6 mb-6">
      <div>
        <h1 class="text-2xl font-black tracking-tight text-slate-900 flex items-center gap-2">
          ✈️ Configuración de Vuelos
        </h1>
        <p class="text-slate-500 text-sm mt-1">Compara tarifas, equipajes y horarios en paralelo para armar la mejor combinación.</p>
      </div>

      <!-- Acciones Globales -->
      <div class="flex flex-wrap items-center gap-3 w-full lg:w-auto">
        <!-- Botón Añadir Vuelo -->
        <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs px-4 py-3 rounded-xl shadow-sm transition flex items-center gap-2">
          <span>+</span> Añadir Vuelo Personalizado
        </button>

        <!-- Indicador Presupuesto -->
        <div class="flex items-center gap-4 bg-slate-50 px-4 py-2.5 border border-slate-200 rounded-xl">
          <div class="text-right">
            <div class="text-[9px] uppercase font-bold text-slate-400 tracking-wider">Total Seleccionado</div>
            <div id="cost-display" class="text-lg font-black text-emerald-600">$0.00 MXN</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Barra de Progreso del Presupuesto -->
    <div class="w-full bg-slate-100 rounded-full h-3 mb-4 overflow-hidden border border-slate-200">
      <div id="budget-progress-bar" class="h-full bg-emerald-500 transition-all duration-500" style="width: 0%"></div>
    </div>

    <div class="flex justify-between items-center text-sm font-semibold text-slate-500">
      <div id="budget-status" class="px-2.5 py-1 rounded-md bg-emerald-50 text-emerald-700 font-extrabold uppercase">
        ¡Dentro del Presupuesto!
      </div>
      <div id="budget-percent" class="font-mono">0% del presupuesto (Límite: $58,000 MXN)</div>
    </div>

    <!-- Pestañas del Planificador -->
    <div class="flex border-t border-slate-100 mt-6 pt-4 gap-2">
      <button class="py-2 px-4 text-xs font-bold uppercase tracking-wider rounded-lg bg-slate-900 text-white shadow-sm">
        ✈️ Vuelos
      </button>
      <button class="py-2 px-4 text-xs font-bold uppercase tracking-wider text-slate-400 rounded-lg hover:bg-slate-50 transition cursor-not-allowed" disabled>
        🏨 Hospedajes (Paso 2)
      </button>
      <button class="py-2 px-4 text-xs font-bold uppercase tracking-wider text-slate-400 rounded-lg hover:bg-slate-50 transition cursor-not-allowed" disabled>
        🗺️ Resumen Completo (Paso 3)
      </button>
    </div>
  </div>

  <!-- PANEL DE ALERTAS Y CONFLICTOS (Dinamico) -->
  <div class="max-w-6xl mx-auto mb-6">
    <div id="alerts-panel" class="rounded-2xl p-5 border transition-all duration-300">
      <!-- Se llena con Javascript -->
    </div>
  </div>

  <!-- CONTENEDOR EN PARALELO -->
  <div class="max-w-6xl mx-auto grid grid-cols-1 lg:grid-cols-2 gap-6">

    <!-- COLUMNA MARIO (CDMX) -->
    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col gap-6">
      <!-- Info Header -->
      <div class="flex justify-between items-center border-b border-slate-100 pb-4">
        <div class="flex items-center gap-2.5">
          <div class="w-2.5 h-2.5 bg-blue-500 rounded-full"></div>
          <h2 class="text-lg font-extrabold tracking-tight text-slate-900">Mario (CDMX)</h2>
        </div>
        <span id="mario-total-cost" class="text-sm font-extrabold text-blue-600 bg-blue-50 px-3 py-1 rounded-lg">$0.00 MXN</span>
      </div>

      <!-- Segmento 1: MEX-MAD y BOG-MEX -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-2">Vuelo 1: CDMX ➔ Madrid (Ida y Vuelta)</label>
          <select id="select-marioTrans" onchange="changeFlight('marioTrans', this.value)" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 shadow-sm">
            <!-- Cargado por JS -->
          </select>
        </div>
        
        <!-- Contenedor del Boleto Activo (Lego Brick) -->
        <div id="brick-marioTrans">
          <!-- Renderizado dinamicamente -->
        </div>
      </div>

      <!-- Segmento 2: BCN-BOG -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-2">Vuelo 2: Conexión España ➔ Colombia (BCN ➔ BOG)</label>
          <select id="select-marioBcn" onchange="changeFlight('marioBcn', this.value)" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-700 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 shadow-sm">
            <!-- Cargado por JS -->
          </select>
        </div>
        
        <!-- Contenedor del Boleto Activo (Lego Brick) -->
        <div id="brick-marioBcn">
          <!-- Renderizado dinamicamente -->
        </div>
      </div>
    </div>

    <!-- COLUMNA YESICA (LA PALMA) -->
    <div class="bg-white border border-slate-200 rounded-2xl p-6 shadow-sm flex flex-col gap-6">
      <!-- Info Header -->
      <div class="flex justify-between items-center border-b border-slate-100 pb-4">
        <div class="flex items-center gap-2.5">
          <div class="w-2.5 h-2.5 bg-pink-500 rounded-full"></div>
          <h2 class="text-lg font-extrabold tracking-tight text-slate-900">Yesica (La Palma)</h2>
        </div>
        <span id="yesica-total-cost" class="text-sm font-extrabold text-pink-600 bg-pink-50 px-3 py-1 rounded-lg">$0.00 MXN</span>
      </div>

      <!-- Segmento 1: SPC-MAD-SPC -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-2">Vuelo 1: Conexión Nacional (La Palma ➔ Madrid Redondo)</label>
          <select id="select-yesicaSpc" onchange="changeFlight('yesicaSpc', this.value)" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-700 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 shadow-sm">
            <!-- Cargado por JS -->
          </select>
        </div>
        
        <!-- Contenedor del Boleto Activo (Lego Brick) -->
        <div id="brick-yesicaSpc">
          <!-- Renderizado dinamicamente -->
        </div>
      </div>

      <!-- Segmento 2: BCN-BOG & BOG-MAD -->
      <div class="space-y-4">
        <div>
          <label class="block text-xs font-extrabold text-slate-400 uppercase tracking-wider mb-2">Vuelo 2: Conexión España ➔ Colombia (Multidestino)</label>
          <select id="select-yesicaTrans" onchange="changeFlight('yesicaTrans', this.value)" class="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-sm font-semibold text-slate-700 focus:outline-none focus:border-pink-500 focus:ring-1 focus:ring-pink-500 shadow-sm">
            <!-- Cargado por JS -->
          </select>
        </div>
        
        <!-- Contenedor del Boleto Activo (Lego Brick) -->
        <div id="brick-yesicaTrans">
          <!-- Renderizado dinamicamente -->
        </div>
      </div>
    </div>

  </div>

  <!-- MODAL PARA AÑADIR VUELOS -->
  <div id="modal-add-flight" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm hidden items-center justify-center p-4 z-50 transition-all duration-300">
    <div class="bg-white rounded-2xl border border-slate-200 shadow-xl max-w-lg w-full p-6 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-100 pb-3">
        <h3 class="text-base font-extrabold text-slate-900">✈️ Añadir Vuelo Personalizado</h3>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold">×</button>
      </div>

      <form id="form-flight" onsubmit="saveCustomFlight(event)" class="space-y-3.5">
        <!-- Persona y Tramo -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Viajero</label>
            <select id="form-traveler" onchange="updateFormSegments(this.value)" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-semibold focus:outline-none focus:border-blue-500">
              <option value="mario">Mario (CDMX)</option>
              <option value="yesica">Yesica (La Palma)</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Tramo de Vuelo</label>
            <select id="form-segment" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-semibold focus:outline-none focus:border-blue-500">
              <!-- Dinamico -->
            </select>
          </div>
        </div>

        <!-- Aerolínea y Tarifa -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Aerolínea / Compañía</label>
            <select id="form-airline" class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-semibold focus:outline-none focus:border-blue-500">
              <option value="iberia">Iberia</option>
              <option value="iberia-express">Iberia Express</option>
              <option value="avianca">Avianca</option>
              <option value="binter">Binter Canarias</option>
              <option value="aeromexico-iberia">Aeroméxico / Iberia</option>
              <option value="air-canada">Air Canada</option>
              <option value="united">United Airlines</option>
              <option value="vueling">Vueling</option>
              <option value="air-europa">Air Europa</option>
            </select>
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Tipo de Tarifa</label>
            <input type="text" id="form-class" placeholder="Ej. Tarifa Classic (Turista)" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-semibold focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <!-- Detalles y Horarios -->
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Detalles de Ruta</label>
            <input type="text" id="form-details" placeholder="Ej. MEX ➔ MAD (Directo)" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-semibold focus:outline-none focus:border-blue-500">
          </div>
          <div>
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Horarios y Fechas</label>
            <input type="text" id="form-schedule" placeholder="Ej. Ida: 12:00 | Vuelta: 23:00" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-semibold focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <!-- Precio y Descripción -->
        <div class="grid grid-cols-3 gap-3">
          <div class="col-span-1">
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Precio (MXN)</label>
            <input type="number" id="form-price" placeholder="Ej. 18500" required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-semibold focus:outline-none focus:border-blue-500">
          </div>
          <div class="col-span-2">
            <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Breve Descripción</label>
            <input type="text" id="form-desc" placeholder="Ej. Escalas cómodas de 2 horas en Miami." required class="w-full bg-slate-50 border border-slate-200 rounded-lg p-2 text-xs font-semibold focus:outline-none focus:border-blue-500">
          </div>
        </div>

        <!-- Inclusiones (Checkboxes) -->
        <div>
          <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2">¿Qué extras incluye el boleto?</label>
          <div class="flex gap-4 bg-slate-50 p-3 rounded-lg border border-slate-100 text-xs font-semibold text-slate-600">
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="checkbox" id="form-bag" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
              🧳 Maleta en bodega (23kg)
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="checkbox" id="form-carry" checked class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
              🎒 Carry-on (Mano)
            </label>
            <label class="flex items-center gap-1.5 cursor-pointer">
              <input type="checkbox" id="form-seat" class="rounded border-slate-300 text-blue-600 focus:ring-blue-500">
              💺 Asiento incluido
            </label>
          </div>
        </div>

        <!-- Botones de Acción -->
        <div class="flex justify-end gap-2.5 pt-3 border-t border-slate-100">
          <button type="button" onclick="closeModal()" class="px-4 py-2 border border-slate-200 hover:bg-slate-50 rounded-lg text-xs font-bold text-slate-600 transition">Cancelar</button>
          <button type="submit" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-lg text-xs font-bold shadow-sm transition">Guardar Vuelo</button>
        </div>
      </form>
    </div>
  </div>

          <svg class="h-3.5 w-8" viewBox="0 0 100 25" fill="none"><path d="M5 2h10v20H5V2z" fill="#D71920"/><path d="M18 2h6v20h-6V2z" fill="#FAC800"/><text x="30" y="18" fill="#D71920" font-family="sans-serif" font-weight="bold" font-size="11">IB</text></svg>
          <span class="text-slate-300 text-xs">|</span>
          <svg class="h-3.5 w-10" viewBox="0 0 120 25" fill="none"><circle cx="12" cy="12" r="10" fill="#0F2C59"/><path d="M7 12l4-4 4 4-4 4-4-4z" fill="white"/><text x="28" y="17" fill="#0F2C59" font-family="sans-serif" font-weight="bold" font-size="10">AM</text></svg>
        </div>
      `,
      "iberia": `
        <div class="bg-white border border-slate-100 rounded px-2 py-1 flex items-center shadow-sm">
          <svg class="h-3.5 w-14" viewBox="0 0 100 25" fill="none"><path d="M5 2h10v20H5V2z" fill="#D71920"/><path d="M18 2h6v20h-6V2z" fill="#FAC800"/><text x="30" y="18" fill="#D71920" font-family="sans-serif" font-weight="bold" font-size="11">IBERIA</text></svg>
        </div>
      `,
      "iberia-express": `
        <div class="bg-white border border-slate-100 rounded px-2 py-1 flex items-center shadow-sm">
          <svg class="h-3.5 w-20" viewBox="0 0 100 25" fill="none"><path d="M5 2h10v20H5V2z" fill="#D71920"/><path d="M18 2h6v20h-6V2z" fill="#FAC800"/><text x="30" y="18" fill="#D71920" font-family="sans-serif" font-weight="bold" font-size="9">EXPRESS</text></svg>
        </div>
      `,
      "avianca": `
        <div class="bg-white border border-slate-100 rounded px-2 py-1 flex items-center shadow-sm">
          <svg class="h-3.5 w-16" viewBox="0 0 100 25" fill="none"><path d="M5 5c15 0 20 15 30 15s10-15 5-15" fill="#E2231A"/><text x="35" y="18" fill="#E2231A" font-family="sans-serif" font-weight="bold" font-size="11">avianca</text></svg>
        </div>
      `,
      "air-canada": `
        <div class="bg-white border border-slate-100 rounded px-2 py-1 flex items-center shadow-sm">
          <span class="text-[10px] font-black text-red-600 mr-1">🍁</span>
          <span class="text-[10px] font-black text-slate-800 tracking-tight uppercase">Air Canada</span>
        </div>
      `,
      "united": `
        <div class="bg-white border border-slate-100 rounded px-2 py-1 flex items-center shadow-sm">
          <span class="text-[10px] font-black text-blue-600 mr-1">🇺🇸</span>
          <span class="text-[10px] font-black text-slate-800 tracking-tight uppercase font-mono">United</span>
        </div>
      `,
      "binter": `
        <div class="bg-white border border-slate-100 rounded px-2 py-1 flex items-center shadow-sm">
          <svg class="h-3.5 w-14" viewBox="0 0 100 25" fill="none"><path d="M5 10c5-5 10-5 15 0s10 5 15 0" stroke="#00A859" stroke-width="3" stroke-linecap="round"/><text x="40" y="18" fill="#00A859" font-family="sans-serif" font-weight="bold" font-size="11">Binter</text></svg>
        </div>
      `,
      "vueling": `
        <div class="bg-white border border-slate-100 rounded px-2 py-1 flex items-center shadow-sm">
          <span class="text-[10px] font-black text-amber-500 mr-1">🟡</span>
          <span class="text-[10px] font-black text-slate-800 tracking-tight uppercase">Vueling</span>
        </div>
      `,
      "air-europa": `
        <div class="bg-white border border-slate-100 rounded px-2 py-1 flex items-center shadow-sm">
          <span class="text-[10px] font-black text-blue-500 mr-1">🔵</span>
          <span class="text-[10px] font-black text-slate-800 tracking-tight uppercase">Air Europa</span>
        </div>
      `
    };

    // Cargar Vuelos Customizados de LocalStorage
    let customFlights = JSON.parse(localStorage.getItem('travel_planner_custom_flights')) || {
      marioTrans: [],
      marioBcn: [],
      yesicaSpc: [],
      yesicaTrans: []
    };

    // Obtener lista unificada de vuelos (Default + Custom)
    function getFlights(key) {
      return [...defaultFlights[key], ...(customFlights[key] || [])];
    }

    // Variables de Estado Inicial
    const defaultState = {
      marioTrans: 'directo',
      marioBcn: 'escala',
      yesicaSpc: '16',
      yesicaTrans: 'escala'
    };

    let state = JSON.parse(localStorage.getItem('travel_planner_state')) || defaultState;

    // Inicializar los Dropdowns
    function initDropdowns() {
      ['marioTrans', 'marioBcn', 'yesicaSpc', 'yesicaTrans'].forEach(key => {
        const select = document.getElementById(`select-${key}`);
        select.innerHTML = "";
        
        getFlights(key).forEach(opt => {
          const option = document.createElement('option');
          option.value = opt.id;
          option.innerText = `${opt.title} - $${new Intl.NumberFormat('es-MX').format(opt.price)} MXN`;
          select.appendChild(option);
        });
        
        // Comprobar si el estado actual sigue siendo válido, si no, seleccionar el primero
        const exists = getFlights(key).some(f => f.id === state[key]);
        if (!exists && getFlights(key).length > 0) {
          state[key] = getFlights(key)[0].id;
        }
        select.value = state[key];
      });
    }

    // Modificar selección de vuelo
    function changeFlight(key, val) {
      state[key] = val;

      // SINCRONIZACIÓN DE VUELO DE CONEXIÓN ESPAÑA -> COLOMBIA (JUNTOS)
      if (key === 'marioBcn') {
        if (val === 'directo') {
          state.yesicaTrans = 'directo';
          document.getElementById('select-yesicaTrans').value = 'directo';
        } else if (val === 'escala') {
          state.yesicaTrans = 'escala';
          document.getElementById('select-yesicaTrans').value = 'escala';
        }
      } else if (key === 'yesicaTrans') {
        if (val === 'directo') {
          state.marioBcn = 'directo';
          document.getElementById('select-marioBcn').value = 'directo';
        } else if (val === 'escala') {
          state.marioBcn = 'escala';
          document.getElementById('select-marioBcn').value = 'escala';
        }
      }

      localStorage.setItem('travel_planner_state', JSON.stringify(state));
      render();
    }

    // LÓGICA DE MODAL
    function openModal() {
      document.getElementById('modal-add-flight').classList.remove('hidden');
      document.getElementById('modal-add-flight').classList.add('flex');
      updateFormSegments('mario');
    }

    function closeModal() {
      document.getElementById('modal-add-flight').classList.add('hidden');
      document.getElementById('modal-add-flight').classList.remove('flex');
      document.getElementById('form-flight').reset();
    }

    function updateFormSegments(traveler) {
      const segmentSelect = document.getElementById('form-segment');
      segmentSelect.innerHTML = "";
      if (traveler === 'mario') {
        segmentSelect.innerHTML = `
          <option value="marioTrans">Vuelo 1: Ruta Transatlántica (MEX-MAD-BOG-MEX)</option>
          <option value="marioBcn">Vuelo 2: Conexión BCN ➔ BOG</option>
        `;
      } else {
        segmentSelect.innerHTML = `
          <option value="yesicaSpc">Vuelo 1: Conexión SPC ➔ MAD</option>
          <option value="yesicaTrans">Vuelo 2: Conexión España ➔ Colombia</option>
        `;
      }
    }

    // Guardar Vuelo Custom
    function saveCustomFlight(e) {
      e.preventDefault();
      const segment = document.getElementById('form-segment').value;
      const airline = document.getElementById('form-airline').value;
      const airlineText = document.getElementById('form-airline').options[document.getElementById('form-airline').selectedIndex].text;
      
      const newFlight = {
        id: "custom_" + Date.now(),
        title: `${airlineText} (Personalizado)`,
        airline: airline,
        price: parseFloat(document.getElementById('form-price').value),
        description: document.getElementById('form-desc').value,
        details: document.getElementById('form-details').value,
        schedule: document.getElementById('form-schedule').value,
        class: document.getElementById('form-class').value,
        bag: document.getElementById('form-bag').checked,
        carry: document.getElementById('form-carry').checked,
        seat: document.getElementById('form-seat').checked
      };

      customFlights[segment].push(newFlight);
      localStorage.setItem('travel_planner_custom_flights', JSON.stringify(customFlights));

      // Recargar dropdowns y seleccionar el nuevo
      initDropdowns();
      changeFlight(segment, newFlight.id);
      
      closeModal();
    }

    // Render y cálculo en vivo
    function render() {
      // Obtener objetos de vuelo seleccionados (buscando en combinados)
      const marioTransObj = getFlights('marioTrans').find(f => f.id === state.marioTrans) || getFlights('marioTrans')[0];
      const marioBcnObj = getFlights('marioBcn').find(f => f.id === state.marioBcn) || getFlights('marioBcn')[0];
      const yesicaSpcObj = getFlights('yesicaSpc').find(f => f.id === state.yesicaSpc) || getFlights('yesicaSpc')[0];
      const yesicaTransObj = getFlights('yesicaTrans').find(f => f.id === state.yesicaTrans) || getFlights('yesicaTrans')[0];

      // Totales
      const marioTotal = marioTransObj.price + marioBcnObj.price;
      const yesicaTotal = yesicaSpcObj.price + yesicaTransObj.price;
      const grandTotal = marioTotal + yesicaTotal;
      const budgetLimit = 58000;
      const progressPercent = Math.min((grandTotal / budgetLimit) * 100, 100);

      // Formatear
      const formatMXN = (val) => new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(val);

      // Inyectar Totales en el DOM
      document.getElementById('cost-display').innerText = formatMXN(grandTotal);
      document.getElementById('mario-total-cost').innerText = formatMXN(marioTotal);
      document.getElementById('yesica-total-cost').innerText = formatMXN(yesicaTotal);

      // Actualizar Barra
      const progressBar = document.getElementById('budget-progress-bar');
      const budgetStatus = document.getElementById('budget-status');
      const budgetPercentText = document.getElementById('budget-percent');
      
      progressBar.style.width = progressPercent + '%';
      budgetPercentText.innerText = `${Math.round(progressPercent)}% del presupuesto`;

      if (grandTotal <= budgetLimit) {
        progressBar.className = "h-full bg-emerald-500 transition-all duration-500";
        budgetStatus.className = "px-2.5 py-1 rounded-md bg-emerald-50 text-emerald-700 font-extrabold uppercase";
        budgetStatus.innerText = "¡Dentro del Presupuesto!";
        document.getElementById('cost-display').className = "text-xl font-black text-emerald-600";
      } else {
        progressBar.className = "h-full bg-rose-500 transition-all duration-500";
        budgetStatus.className = "px-2.5 py-1 rounded-md bg-rose-50 text-rose-700 font-extrabold uppercase animate-pulse";
        budgetStatus.innerText = "¡Presupuesto Excedido!";
        document.getElementById('cost-display').className = "text-xl font-black text-rose-600";
      }

      // Renderizar los Lego Bricks Activos (Boletos de abordar)
      const renderBrick = (targetId, flight, isActiveMario) => {
        const container = document.getElementById(targetId);
        const activeClass = isActiveMario ? 'border-blue-500 bg-blue-50/20' : 'border-pink-500 bg-pink-50/20';
        
        container.innerHTML = `
          <div class="ticket-card border ${activeClass} rounded-xl p-4 flex flex-col justify-between shadow-sm">
            <div class="flex justify-between items-start gap-4">
              <div class="flex-grow">
                <div class="flex items-center gap-2 mb-2.5">
                  ${airlineLogos[flight.airline] || ''}
                  <span class="text-[10px] font-extrabold uppercase tracking-wide bg-white px-2 py-0.5 rounded border border-slate-100 shadow-sm">${flight.class}</span>
                </div>
                <div class="text-base font-extrabold text-slate-900">${flight.details}</div>
                <div class="text-xs font-mono text-slate-500 mt-1 flex items-center gap-1.5">
                  ⏱️ ${flight.schedule}
                </div>
                <p class="text-xs text-slate-500 mt-2">${flight.description}</p>
              </div>
              <div class="text-right">
                <span class="text-xs text-slate-400 block font-semibold">Costo</span>
                <span class="text-base font-black text-slate-900">${formatMXN(flight.price)}</span>
              </div>
            </div>
            <!-- Beneficios -->
            <div class="flex items-center gap-4 mt-4 pt-3 border-t border-slate-100 text-xs font-medium text-slate-500">
              <span class="flex items-center gap-1 ${flight.bag ? 'text-emerald-600' : 'text-rose-500'}">
                ${flight.bag ? '✓ 🧳 Maleta' : '✗ Sin Maleta'}
              </span>
              <span class="flex items-center gap-1 ${flight.carry ? 'text-emerald-600' : 'text-rose-500'}">
                ${flight.carry ? '✓ 🎒 Carry-on' : '✗ Sin Carry-on'}
              </span>
              <span class="flex items-center gap-1 ${flight.seat ? 'text-emerald-600' : 'text-rose-500'}">
                ${flight.seat ? '✓ 💺 Asiento' : '✗ Sin Asiento'}
              </span>
            </div>
          </div>
        `;
      };

      renderBrick('brick-marioTrans', marioTransObj, true);
      renderBrick('brick-marioBcn', marioBcnObj, true);
      renderBrick('brick-yesicaSpc', yesicaSpcObj, false);
      renderBrick('brick-yesicaTrans', yesicaTransObj, false);

      // 4. DETECCION DE CONFLICTOS Y ALERTAS
      const warnings = [];
      const infos = [];

      // A. Conflicto: Presupuesto Excedido
      if (grandTotal > budgetLimit) {
        warnings.push({
          title: "Presupuesto Excedido",
          text: `El total de vuelos supera el límite establecido por ${formatMXN(grandTotal - budgetLimit)}. Considera cambiar a vuelos con escalas o tarifas básicas.`
        });
      }

      // B. Conflicto: Viajan por separado España -> Colombia
      if (state.marioBcn === 'separado' || state.yesicaTrans === 'eco') {
        warnings.push({
          title: "No viajan juntos de España a Colombia",
          text: "Han seleccionado vuelos separados para el trayecto Barcelona ➔ Bogotá. Esto rompe la regla de viajar juntos en este tramo."
        });
      }

      // C. Alerta: Escala Muy Corta (Binter)
      if (state.yesicaSpc.startsWith('17')) {
        warnings.push({
          title: "Escala Corta en Tenerife (Binter)",
          text: "El vuelo de Yesica el sábado 17 tiene una escala de solo 1 hora y 5 minutos en Tenerife Norte (TFN). Hay riesgo elevado de pérdida de conexión ante cualquier retraso."
        });
        
        // Llegada asíncrona a Madrid
        infos.push({
          title: "Llegadas Asíncronas a Madrid",
          text: "Mario llega a Madrid el viernes 16 y Yesica el sábado 17. Mario pasará la primera noche solo en Madrid."
        });
      }

      // D. Alerta: Visa de transito para Mario
      if (state.marioTrans === 'escala' || state.marioTrans === 'united') {
        warnings.push({
          title: "Visa / Permiso Requerido para Mario",
          text: `Tu vuelo con escala transatlántica pasa por ${state.marioTrans === 'escala' ? 'Canadá' : 'EE.UU.'}. Necesitarás ${state.marioTrans === 'escala' ? 'eTA canadiense' : 'visa estadounidense (C-1 o B1/B2)'} para abordar.`
        });
      }

      // Renderizar Alertas
      const alertsPanel = document.getElementById('alerts-panel');
      if (warnings.length === 0 && infos.length === 0) {
        alertsPanel.className = "rounded-2xl p-5 border border-emerald-200 bg-emerald-50/50 text-emerald-800 text-xs font-medium flex items-center gap-3";
        alertsPanel.innerHTML = `
          <span class="text-base">✓</span>
          <div>
            <strong class="font-bold block">¡Logística en orden!</strong>
            No hay conflictos de horarios, escalas cortas ni presupuesto excedido con esta combinación de vuelos.
          </div>
        `;
      } else {
        alertsPanel.className = "rounded-2xl p-5 border border-slate-200 bg-white text-xs space-y-4 shadow-sm";
        alertsPanel.innerHTML = "";

        if (warnings.length > 0) {
          const warnContainer = document.createElement('div');
          warnContainer.className = "space-y-2.5";
          warnContainer.innerHTML = `<h4 class="font-black text-rose-600 uppercase tracking-wider text-[10px] flex items-center gap-1.5">⚠️ Conflictos Críticos (${warnings.length})</h4>`;
          
          warnings.forEach(w => {
            const el = document.createElement('div');
            el.className = "pl-3 border-l-2 border-rose-500";
            el.innerHTML = `<strong class="font-bold text-rose-800 block">${w.title}</strong><p class="text-slate-600 mt-0.5">${w.text}</p>`;
            warnContainer.appendChild(el);
          });
          alertsPanel.appendChild(warnContainer);
        }

        if (infos.length > 0) {
          const infoContainer = document.createElement('div');
          infoContainer.className = "space-y-2.5 pt-3 border-t border-slate-100";
          infoContainer.innerHTML = `<h4 class="font-black text-blue-600 uppercase tracking-wider text-[10px] flex items-center gap-1.5">ℹ️ Avisos e Información (${infos.length})</h4>`;
          
          infos.forEach(i => {
            const el = document.createElement('div');
            el.className = "pl-3 border-l-2 border-blue-500";
            el.innerHTML = `<strong class="font-bold text-blue-800 block">${i.title}</strong><p class="text-slate-600 mt-0.5">${i.text}</p>`;
            infoContainer.appendChild(el);
          });
          alertsPanel.appendChild(infoContainer);
        }
      }
    }

    // Inicializar
    initDropdowns();
    render();
  </script>
</body>
