name: Actualización Automática de Tarifas de Vuelos

on:
  schedule:
    # Se ejecuta todos los días a las 06:00 UTC (medianoche en CDMX / 07:00 en Canarias)
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      dep:
        description: 'Código IATA Origen (ej. MAD, MEX)'
        required: false
        default: ''
      arr:
        description: 'Código IATA Destino (ej. BOG, MAD)'
        required: false
        default: ''
      date:
        description: 'Fecha de Vuelo (YYYY-MM-DD)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  update-flights:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar Repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Instalar Dependencias
        run: |
          pip install -r requirements.txt

      - name: ✈️ Ejecutar Motor de Búsqueda y Filtrado Migratorio
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.dep }}" ] && [ -n "${{ github.event.inputs.arr }}" ] && [ -n "${{ github.event.inputs.date }}" ]; then
            python scripts/update_flights.py --dep "${{ github.event.inputs.dep }}" --arr "${{ github.event.inputs.arr }}" --date "${{ github.event.inputs.date }}"
          else
            python scripts/update_flights.py
          fi

      - name: 💾 Guardar Cambios y Publicar en GitHub Pages
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Travel Planner Bot"
          git add data/flights.json
          if git diff --staged --quiet; then
            echo "ℹ️ No hubo cambios en las tarifas ni catálogo."
          else
            git commit -m "🤖 Auto-update: Actualización automática de tarifas de vuelos"
            git pull --rebase origin main || true
            git push origin main
          fi
