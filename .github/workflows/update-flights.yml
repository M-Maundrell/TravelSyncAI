name: Discover Flights On-Demand

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run discovery script
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_flights.py --use_request_file
      - name: Commit results
        run: |
          git config --global user.name "TravelSync Agent"
          git config --global user.email "bot@travelsync.ai"
          git add data/flights.json
          git commit -m "data: update live flight prices on demand" || echo "No changes"
          git push
